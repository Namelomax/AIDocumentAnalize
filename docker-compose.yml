services:
  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inspector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inspector}
      POSTGRES_DB: ${POSTGRES_DB:-inspector}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspector} -d ${POSTGRES_DB:-inspector}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-inspector}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-inspector}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-inspector}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-inspector123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Customer's ТЗ p.29, "Антивирусная защита": every file the api accepts is
  # scanned by clamd (services/api/src/antivirus.ts) before it is stored. The
  # official image ships its virus database baked in at build time (verified
  # against /var/lib/clamav/*.cvd), so CLAMAV_NO_FRESHCLAMD=true is enough to
  # start and serve scans with no network at all - freshclam's own periodic
  # updates are simply never attempted on an offline stand that could not
  # reach them anyway.
  clamav:
    image: clamav/clamav@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      - "3310:3310"
    healthcheck:
      # clamd's own health probe (baked into the image): asks clamd itself
      # over the same TCP port the api scans through, rather than a socket
      # file that can exist slightly before clamd is actually ready.
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    image: inspector-api:1.0.0
    build: ./services/api
    # No env_file: every variable below already carries its default, and a
    # .env in the project root is still picked up for ${VAR:-default}
    # interpolation. This also drops the Compose >= 2.24 requirement that the
    # "required: false" form would put on the verification stand.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inspector}:${POSTGRES_PASSWORD:-inspector}@postgres:5432/${POSTGRES_DB:-inspector}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://inspector:inspector@rabbitmq:5672/}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-inspector}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-inspector123}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-62914560}
      MAX_PACKAGE_BYTES: ${MAX_PACKAGE_BYTES:-209715200}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      TASK_QUEUE: ${TASK_QUEUE:-inspector.tasks}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123}
      DEMO_INSPECTOR_PASSWORD: ${DEMO_INSPECTOR_PASSWORD:-inspector123}
      DEMO_SUPERVISOR_PASSWORD: ${DEMO_SUPERVISOR_PASSWORD:-supervisor123}
      DEMO_ML_PASSWORD: ${DEMO_ML_PASSWORD:-ml123}
      JWT_TTL: ${JWT_TTL:-12h}
      # Section 9.6: transfer of a finalized protocol to ИАИС «РиН». Points
      # at the local mock (deploy/rin-mock) by default - plain HTTP, since
      # the stand is offline and carries no real УКЭП certificate chain.
      # Setting RIN_CLIENT_CERT/RIN_CLIENT_KEY (and pointing RIN_BASE_URL at
      # an https:// host) is what turns on the real mTLS client the ТЗ asks
      # for; both are blank here on purpose - see services/api/README or
      # config.ts for the demo-vs-production distinction.
      RIN_BASE_URL: ${RIN_BASE_URL:-http://rin-mock:8090}
      RIN_CLIENT_CERT: ${RIN_CLIENT_CERT:-}
      RIN_CLIENT_KEY: ${RIN_CLIENT_KEY:-}
      RIN_CA: ${RIN_CA:-}
      RIN_RETRY_DELAYS_S: ${RIN_RETRY_DELAYS_S:-60,300,900}
      RIN_INBOUND_TOKEN: ${RIN_INBOUND_TOKEN:-change-me-rin-token}
      RIN_SCHEDULER_INTERVAL_MS: ${RIN_SCHEDULER_INTERVAL_MS:-15000}
      RIN_REQUEST_TIMEOUT_MS: ${RIN_REQUEST_TIMEOUT_MS:-10000}
      # Customer's ТЗ p.29, "Антивирусная защита" - see the clamav service
      # above and services/api/src/antivirus.ts.
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      ANTIVIRUS_REQUIRED: ${ANTIVIRUS_REQUIRED:-true}
      # Customer's ТЗ p.31, "Проверка целостности данных" (services/api/src/integrity.ts).
      INTEGRITY_CHECK_CRON_HOUR: ${INTEGRITY_CHECK_CRON_HOUR:-3}
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      rin-mock: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Section 9.6: local stand-in for ИАИС «РиН» (deploy/rin-mock) - the real
  # system is unreachable from the offline stand. Stores every payload it
  # receives under ./data/rin-mock and can be told to fail the next N calls
  # (POST /admin/config) to demonstrate the api's own retry ladder.
  rin-mock:
    image: inspector-rin-mock:1.0.0
    build: ./deploy/rin-mock
    environment:
      RIN_MOCK_FAIL_FIRST: ${RIN_MOCK_FAIL_FIRST:-0}
    volumes:
      - ./data/rin-mock:/data
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: inspector-worker:1.0.0
    build: ./services/worker
    # No env_file: every variable below already carries its default, and a
    # .env in the project root is still picked up for ${VAR:-default}
    # interpolation. This also drops the Compose >= 2.24 requirement that the
    # "required: false" form would put on the verification stand.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inspector}:${POSTGRES_PASSWORD:-inspector}@postgres:5432/${POSTGRES_DB:-inspector}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://inspector:inspector@rabbitmq:5672/}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-inspector}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-inspector123}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TASK_QUEUE: ${TASK_QUEUE:-inspector.tasks}
      MODEL_VERSION: ${MODEL_VERSION:-rules-2026.09}
      DATASET_VERSION: ${DATASET_VERSION:-none}
      # A local language model behind an OpenAI-compatible interface (plan
      # 8). Left blank, the worker runs without one and reports
      # NOT_COMPARABLE for the checks that need it -- no default here may
      # name a real host. On the verification stand this points at the
      # vLLM service; in development on Windows with LM Studio it is
      # http://host.docker.internal:1234/v1, and LM Studio must have
      # "Serve on Local Network" turned on so the container (which is not
      # the host) can reach it.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      # Customer's ТЗ p.16, п.1 "Распознавание текста (OCR)": a page with no
      # text layer (app.pdf.extract's needs_ocr) is OCR'd by this local model
      # - same OpenAI-compatible interface as the free-search model above,
      # same rule: OCR_MODEL blank turns it off, no default here may name a
      # real host. OCR_BASE_URL defaults to LLM_BASE_URL in app.config, since
      # dev and the stand both already point that at the one local model
      # server; set OCR_BASE_URL only when OCR is served from somewhere else.
      OCR_BASE_URL: ${OCR_BASE_URL:-}
      OCR_MODEL: ${OCR_MODEL:-}
      # LM Studio on the reference dev machine took 40-90s per strip - see
      # app.config.Config.ocr_timeout_s's own comment.
      OCR_TIMEOUT_S: ${OCR_TIMEOUT_S:-120}
      # Customer's ТЗ p.16, п.1: "не менее 300 dpi".
      OCR_DPI: ${OCR_DPI:-300}
      OCR_STRIP_HEIGHT_PX: ${OCR_STRIP_HEIGHT_PX:-800}
      # Section 9.5's free-search hypotheses (SEM-ROOM-FN) are asked about in
      # batches of this many room-name pairs per model call, each batch under
      # LLM_TIMEOUT_S - the reference school package's 23 pairs in one
      # request routinely outran it entirely (services/worker/app/pipeline.py
      # module docstring).
      LLM_BATCH_SIZE: ${LLM_BATCH_SIZE:-5}
      # Customer's ТЗ p.17, "Обработка ошибок при загрузке": a file whose
      # processing hangs past this timeout is retried, and a whole
      # process.start task is retried the same number of times before the
      # process is moved to FAILED (services/worker/app/pipeline.py).
      FILE_PROCESSING_TIMEOUT_S: ${FILE_PROCESSING_TIMEOUT_S:-300}
      PROCESSING_RETRIES: ${PROCESSING_RETRIES:-2}
      # Customer's ТЗ p.16, п.5 "Кеширование": PDF parse results are cached
      # in Redis by file hash. Blank turns the cache off outright - see
      # app.config.Config's own comment - which no default here may do by
      # naming anything but the compose network's own redis service.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PARSE_CACHE_TTL_S: ${PARSE_CACHE_TTL_S:-2592000}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # No curl or wget in python:3.11-slim (services/worker/Dockerfile does
      # not apt-get either), so the probe is a Python one-liner against the
      # worker's own /metrics (app.main, customer's ТЗ p.31) instead - a
      # failed connection or non-2xx status both raise and exit non-zero.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: inspector-web:1.0.0
    build: ./services/web
    ports:
      - "8080:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Customer's ТЗ p.31: "Интеграция с Prometheus для сбора метрик" и
  # "Алертинг". Scrapes api:3000/metrics and worker:9100 (deploy/monitoring/
  # prometheus.yml) and evaluates deploy/monitoring/alert-rules.yml - no
  # Alertmanager here, see deploy/monitoring/README.md for why the stand
  # stops at Prometheus/Grafana's own UI rather than e-mail/Telegram.
  prometheus:
    image: prom/prometheus@sha256:565ee86501224ebbb98fc10b332fa54440b100469924003359edf49cbce374bd
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Customer's ТЗ p.31: "Grafana для визуализации дашбордов". Datasource and
  # dashboard are provisioned (deploy/monitoring/grafana/provisioning) so the
  # dashboard "Инспектор ИИ — эксплуатация" is already there on first login -
  # nothing to click through by hand on a stand no one on the team is present
  # for.
  grafana:
    image: grafana/grafana-oss@sha256:147620479985b5780600dea24223c71eb8525e01727cce7fcd4bba8896d66d60
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Section 12 (access control) applies to Grafana too - no unauthenticated
      # viewer, even for a demo dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
