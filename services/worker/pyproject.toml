[project]
name = "inspector-worker"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "aio-pika>=9.4.0",
  "asyncpg>=0.29.0",
  "minio>=7.2.0",
  "openpyxl>=3.1.5",
  "pymupdf>=1.24.0",
  "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
