server {
    listen 80;
    # musl (Alpine) resolves "localhost" to ::1 first regardless of
    # /etc/hosts order, so an IPv4-only listener makes the healthcheck's
    # "wget http://localhost/" fail with connection refused.
    listen [::]:80;
    root /usr/share/nginx/html;

    # Uploads are up to 200 MiB per package (section 9.1); nginx refuses
    # anything above 1 MiB by default.
    client_max_body_size 210m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # The app routes on the client; any unknown path is the app itself.
    location / {
        try_files $uri /index.html;
    }
}
