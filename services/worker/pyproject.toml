[project]
name = "inspector-worker"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "aio-pika>=9.4.0",
  "asyncpg>=0.29.0",
  "minio>=7.2.0",
  "openpyxl>=3.1.5",
  "pymupdf>=1.24.0",
  "pyyaml>=6.0",
  # Customer's ТЗ p.16, п.5 "Кеширование": the parse cache (app.pdf.cache).
  "redis>=5.0.0,<6",
  "python-json-logger>=2.0.7",
  # Pinned exactly (not >=): the /metrics exporter's client library, whose
  # wire format Prometheus itself depends on staying stable across the stand.
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_llm: needs a real OpenAI-compatible server reachable at LLM_BASE_URL; the test itself skips when that variable is unset",
]
